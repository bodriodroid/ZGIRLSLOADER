; Example --moves file for zdroid_mugen (see docs/MODS.md, "Converting a MUGEN character").
; The numbers are action numbers of the character's .air and the game's own units; every key is optional.
; These are placeholders: use the action numbers of the character you convert.
[Moves]
stand = 0
walkfwd = 20
walkback = 21
crouch = 11
jumpstart = 40
jump = 41, 42, 43        ; neutral, forward, back
land = 47
hit = 5000
crouchhit = 5010
airhit = 5020
walkspeed = 6
walkbackspeed = 4.5
jumpspeed = 32
jumpforward = 8
jumpback = 7
life = 14300
push = 38, 40            ; back, front: how far the body pushes the opponent

[Attack s.Jab]
posture = stand
button = LP MP HP
anim = 200, 201
damage = 350
hitstop = 7
hitstun = 18
pushback = 8

[Attack c.Low]
posture = crouch
button = LK MK HK
anim = 220
damage = 400
hitstun = 20
pushback = 6

[Attack j.Air]
posture = air
button = LP MP HP LK MK HK
anim = 610
damage = 350
hitstun = 16
pushback = 6
