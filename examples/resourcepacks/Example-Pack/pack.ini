name = Example pack
version = 1
author = you
description = Mixes three translated lines and one challenge into the game instead of replacing the files.
priority = 100

; the folders of this pack count: core/localization/es_loc.json only touches the game's .../core/localization/es_loc.json
match = path
; files of the pack that are not taken at all
ignore = readme.txt, notes/*
; packs that must be on / cannot share a game with this one (ids = folder names)
; requires = some-base-pack
; conflicts = some-other-pack

[merge]
; the default for language files, written out here: key by key, everything else of the game's file stays
loc = keys
; a list of blank-line separated records: the record with the same ChalName is replaced, a new one is added at the end
ui/config/MainMenu/challenges.ini = records ChalName
