# Core + tests on Linux with AddressSanitizer / UndefinedBehaviorSanitizer, with GCC and Clang (no SDL or Android SDK needed).
# The APK workflow (android.yml) only builds the app; this one is what runs the tests.
name: tests
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DZDROID_BUILD_VIEWER=OFF -DZDROID_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # The effect programs (src/fx/fx_glsl.cpp) are rendered with a real GLES driver (Mesa llvmpipe, no GPU) and compared pixel by pixel
  # with the C++ reference (src/fx/fx_math.cpp).  Synthetic numbers only: no game data is involved.
  fx-gles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a software GLES stack
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri python3-numpy
      - name: Build the pack tool
        run: cmake -S . -B build-fx -DCMAKE_BUILD_TYPE=Release -DZDROID_BUILD_VIEWER=OFF -DZDROID_BUILD_TESTS=OFF && cmake --build build-fx --target zdroid_pafx -j
      - name: Generate the cases and render them
        run: |
          ./build-fx/zdroid_pafx gen-check fxcheck
          python3 tools/fx_gles_check.py fxcheck

  # FxRenderer (src/app/fx_gl.cpp): the effect programs inside SDL's real OpenGL ES 2 renderer, headless (SDL's offscreen video driver on
  # Mesa llvmpipe).  Checks sprites, shadows and the outline against the C++ maths, and that SDL's own drawing around a pass is untouched.
  gl-renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and a software GLES stack
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libegl1 libgles2 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build-gl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DZDROID_SANITIZE=ON
      - name: Build
        run: cmake --build build-gl --target zdroid_fx_gl_tests -j
      - name: Run
        run: SDL_VIDEODRIVER=offscreen EGL_PLATFORM=surfaceless ZDROID_GL_REQUIRED=1 ASAN_OPTIONS=detect_leaks=0 ./build-gl/zdroid_fx_gl_tests

  # libFuzzer on the file parsers (clang).  Informational: a crash here is a real bug, a setup problem is not a failed build.
  fuzz:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang runtimes
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev
      - name: Configure
        run: cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DZDROID_BUILD_VIEWER=OFF -DZDROID_FUZZ=ON
      - name: Build
        run: cmake --build build-fuzz --target zdroid_fuzz -j
      - name: Fuzz for one minute
        run: mkdir -p corpus && ./build-fuzz/zdroid_fuzz corpus -max_total_time=60 -rss_limit_mb=2048
