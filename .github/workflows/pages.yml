name: Deploy ZGirlsLoader Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify website
        run: |
          test -s website/index.html || {
            echo "::error::website/index.html is missing or empty"
            exit 1
          }
          echo "Website entry point found."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
          # Each rerun gets a unique artifact name, avoiding duplicate
          # github-pages artifacts from earlier attempts of the same run.
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
