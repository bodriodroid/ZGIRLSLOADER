name: Deploy ZGirlsLoader Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent duplicate push events from publishing the same site concurrently.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify website
        run: |
          test -s website/index.html || {
            echo "::error::website/index.html is missing or empty"
            exit 1
          }
          echo "Website entry point found."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
          # Unique to this workflow run and retry attempt.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # Allow the Actions artifact metadata API to index the uploaded artifact
      # before deploy-pages queries it.
      - name: Wait for artifact metadata
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
