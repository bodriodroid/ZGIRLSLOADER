# CI recipe: Android SDK 34 / NDK 26.1.10909125 / Gradle 8.9.
name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main, master, "ci/**"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Do not request the removed legacy "tools" SDK package.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK, NDK and CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Fetch SDL2
        run: git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon -PsdlDir="$RUNNER_TEMP/SDL" assembleDebug
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zgirlsmobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
